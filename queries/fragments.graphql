fragment FeedMetadata on Feed {
  feedId
  title
  authors
  description
  logo {
    url
    rawUrl
    title
    link {
        href
        rel
        mediaType
        hrefLang
        title
        length
    }
    width
    height
    description
  }
}

fragment EntryMetadata on Entry {
  guid
  title
  summary
  media {
    content {
      url
      contentType
      height
      width
      size
    }
    title
    description
    duration
  }
  content {
    body
    contentType
    length
    src {
      href
      hrefLang
      rel
    }
  }
}