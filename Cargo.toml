[package]
name = "casts"
version = "0.1.0"
authors = ["Duane R Bailey <duane@duane.cc>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
## file type detection
magic = "*"

## progress indicator for cli
indicatif = "*"

## tempfile management for downloads
tempfile = "*"

## human readable size information
bytesize = "*"

## basic html -> text rendering for cli
html2text = "*"
htmlescape = "*"

## ???
xdg = "*"

## console colors for cli
colored = "*"

## audio

rodio = "*"
cpal = "*"
clap = "*"

## error management
anyhow = "*"

## http
hyper = "*"

## actors
actix = { git = "https://github.com/actix/actix" }
actix-rt = { git = "https://github.com/actix/actix-net" }

## feeds
feed-rs = { git = "https://github.com/feed-rs/feed-rs/"}
quick-xml = "*"

## event management
event_source = { path = "../event_source", features = ["sqlite"] }

## serialization

serde = "*"
serde_json = "*"
serde_derive = "*"
async-trait = "*"

## graphql

juniper = "*"
juniper_hyper = "*"

## lib bridging
libc = "*"

## util - misc
base64 = "*"
env_logger = "*"
regex = "*"
url = "*"
log = "*"


[dependencies.futures]
version = "0.3"

[dependencies.tokio]
version = "*"
features = ["rt", "rt-multi-thread", "sync", "macros", "time"]

[dependencies.rusqlite]
version = "*"
features = ["url", "chrono", "uuid"]

[dependencies.reqwest]
version = "*"
features = ["blocking", "stream"]

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "*"
features = ["serde"]
