[package]
name = "casts"
version = "0.1.0"
authors = ["Duane R Bailey <duane@duane.cc>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "casts"

[dependencies]
quick-xml = "*"
libc = "~0.2.67"
feed-rs = "~0.4.0"
url = "2.1.1"
futures = "*"
tokio = "*"
magic = "*"
regex = "*"
indicatif = "*"
tempfile = "*"
bytesize = "*"
html2text = "*"
xdg = "*"
colored = "*"
base64 = "*"
htmlescape = "*"
rodio = "*"
notify-rust = "*"
cpal = "*"
clap = "*"
anyhow = "*"
hyper = "*"

[dependencies.rusqlite]
version = "*"
features = ["url", "chrono", "uuid"]


[dependencies.reqwest]
version = "^0.10.4"
features = ["blocking", "stream"]

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "*"
features = ["serde"]


[[bin]]
name = "validate"
path = "src/bin/validate.rs"
