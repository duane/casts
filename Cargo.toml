[package]
name = "casts"
version = "0.1.0"
authors = ["Duane R Bailey <duane@duane.cc>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "casts"

[[bin]]
name = "daemon"

[dependencies]
quick-xml = "*"
libc = "~0.2.67"
feed-rs = { git = "https://github.com/feed-rs/feed-rs/"}
url = "2.1.1"
futures = "^0.3.8"
magic = "*"
regex = "*"
indicatif = "*"
tempfile = "*"
bytesize = "*"
html2text = "*"
xdg = "*"
colored = "*"
base64 = "*"
htmlescape = "*"
rodio = "*"
cpal = "*"
clap = "*"
anyhow = "*"
hyper = "*"
actix = "*"
actix-rt = "1.1"
env_logger = "*"
log = "*"


[dependencies.tokio]
version = "~1.0.1"
features = ["rt", "rt-multi-thread", "sync"]

[dependencies.rusqlite]
version = "*"
features = ["url", "chrono", "uuid"]

[dependencies.reqwest]
version = "^0.11.0"
features = ["blocking", "stream"]

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "*"
features = ["serde"]


[[bin]]
name = "validate"
path = "src/bin/validate.rs"
