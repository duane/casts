[package]
name = "casts"
version = "0.1.0"
authors = ["Duane R Bailey <duane@duane.cc>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
quick-xml = "*"
libc = "*"
feed-rs = { git = "https://github.com/feed-rs/feed-rs/"}
url = "*"
futures = "^0.3.8"
magic = "*"
regex = "*"
indicatif = "*"
tempfile = "*"
bytesize = "*"
html2text = "*"
xdg = "*"
colored = "*"
base64 = "*"
htmlescape = "*"
rodio = "*"
cpal = "*"
clap = "*"
anyhow = "*"
hyper = "*"
actix = { git = "https://github.com/actix/actix" }
actix-rt = { git = "https://github.com/actix/actix-net" }
env_logger = "*"
log = "*"
event_source = { path = "../event_source", features = ["sqlite"] }
serde = "*"
serde_json = "*"
serde_derive = "*"
async-trait = "*"


[dependencies.tokio]
version = "*"
features = ["rt", "rt-multi-thread", "sync", "macros", "time"]

[dependencies.rusqlite]
version = "*"
features = ["url", "chrono", "uuid"]

[dependencies.reqwest]
version = "*"
features = ["blocking", "stream"]

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "*"
features = ["serde"]
