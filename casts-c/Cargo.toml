[package]
name = "casts-c"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
casts = { path = "../casts" }

juniper = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161" }
juniper_subscriptions = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161" }
juniper-swift = { path = "../juniper-swift" }
log = "*"
pretty_env_logger = "*"
lazy_static = "*"
futures = "*"
serde_json = "*"
tokio = { version = "*", features = ["rt-multi-thread"] }
commit-store = { path = "../commit-store" }
rusqlite = "~0.31.0"
bson = "~2.9.0"

[build-dependencies]
cbindgen = "*"
