syntax = "proto3";

import "google/protobuf/timestamp.proto";

package GrpcInterface;

service CommitStore {
    rpc AppendCommit (CommitAttempt) returns (Commit);
    rpc GetStreamRange(Cursor) returns (Commits);
    rpc StreamStreamRange(Cursor) returns (stream Commit);
}

message CommitAttempt {
    string stream_id = 1;
    int64 stream_version = 2;
    string commit_id = 3;
    google.protobuf.Timestamp commit_timestamp = 4;
    int64 commit_sequence = 5;
    bytes metadata = 6;
    bytes events = 7;
    int64 events_count = 8;
}

message WriteError {
    string description = 1;
    string metadata = 2;
    bytes source = 3;
}

message Commit {
    string stream_id = 1;
    int64 stream_version = 2;
    string commit_id = 3;
    google.protobuf.Timestamp commit_timestamp = 4;
    int64 commit_sequence = 5;
    bytes metadata = 6;
    bytes events = 7;
    int64 events_count = 8;
    int32 dispatch = 9;
}

message Cursor {
    string stream_id = 1;
    int64 min_version = 2;
    int64 max_version = 3;
}

message Commits {
    repeated Commit commits = 1;
}