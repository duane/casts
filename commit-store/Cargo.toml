[package]
name = "commit-store"
version = "0.1.0"
authors = ["Duane R Bailey <bailey.d.r@gmail.com>"]
edition = "2021"

[features]
default = ["full"]

sqlite = ["rusqlite"]
psql = [
  "postgres",
  "postgres-native-tls",
  "native-tls",
  "tokio-postgres",
  "deadpool-postgres",
  "futures",
]

full = ["sqlite", "psql"]

[[bin]] # Bin to run the HelloWorld gRPC server
name = "commit-store-server"

[[bin]]
name = "postgres-provision"
required-features = ["psql"]

[dependencies]

anyhow = "*"
bytes = "*"
async-trait = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "*"
serde_derive = "*"
pretty_env_logger = "*"
chashmap = "*"

log = "~0.4.17"

dotenv = { version = "0.15.0", optional = true }
futures = { version = "~0.3.4", optional = true }
tokio = { version = "~1.32.0", features = ["full"] }
tokio-stream = "*"
fallible-iterator = "*"

postgres = { version = "~0.19.5", optional = true, features = [
  "with-chrono-0_4",
  "with-uuid-1",
  "with-serde_json-1",
] }
postgres-native-tls = { version = "*", optional = true }
tokio-postgres = { version = "~0.7.8", optional = true }
deadpool-postgres = { version = "*", optional = true }

native-tls = { version = "*", optional = true }
openssl = "*"
openssl-sys = "*"
toml = "*"

url = "~2.4.1"

tonic = "*"
prost = "*"
prost-types = "*"
futures-core = "*"

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "~1.4.1"
features = ["v4", "serde"]

[dependencies.rusqlite]
version = "*"
features = ["bundled", "chrono", "serde_json", "trace"]
optional = true

[build-dependencies]
tonic-build = "~0.10.1"
