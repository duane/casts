syntax = "proto3";

import "google/protobuf/timestamp.proto";

package GrpcInterface;

service Casts {
    rpc ListFeeds (ListFeedsRequest) returns (Feeds);
    rpc ListEntries (ListEntriesRequest) returns (Entries);
    rpc GetFeed (GetFeedRequest) returns (Feed);
    // Record the playback position reached for one entry. Last write wins.
    rpc RecordPlayback (RecordPlaybackRequest) returns (RecordPlaybackResponse);
    // Fetch the feed at a url and add it to the stream.
    rpc AddFeed (AddFeedRequest) returns (AddFeedResponse);
}

message AddFeedRequest {
    string streamId = 1;
    string url = 2;
}

message AddFeedResponse {
    string feedId = 1;
    string commitId = 2;
}

message RecordPlaybackRequest {
    string streamId = 1;
    string feedId = 2;
    string entryGuid = 3;
    // Playback position reached: whole seconds plus sub-second remainder.
    int64 elapsedSeconds = 4;
    int32 elapsedNanos = 5;
}

message RecordPlaybackResponse {
    // The commit that recorded the playback, empty when the position was
    // unchanged and nothing needed committing.
    string commitId = 1;
}

message GetFeedRequest {
    string feedId = 1;
    string streamId = 2;
}

message ListFeedsRequest {
    string streamId = 1;
}


message ListEntriesRequest {
    string streamId = 1;
    // Optional: restrict the page to one feed. Empty lists every feed in
    // the stream.
    string feedId = 2;
    // Maximum entries in the response. Zero asks for the server default.
    // A larger value than the server allows is clamped, not refused: the
    // caller still receives everything, across more pages.
    int32 limit = 3;
    // The `nextPageToken` from the previous response. Opaque: it encodes an
    // ordering that is the server's to change.
    string pageToken = 4;
}

message Feed {
    string feedId = 1;
    string title = 2;
    repeated string authors = 3;
    string description = 4;
    Image logo = 5;
    // Field 6 held `repeated Entry entries`. A feed embedding its whole
    // back-catalog made every response unbounded in the size of the feed
    // (7.16 MB for one long-running show, and 78 MB for a ListFeeds over an
    // imported library), which is past what clients accept. Entries now come
    // from ListEntries, which pages. Reserved so no later field silently
    // reuses the number and misparses an old client's message.
    reserved 6;
}

message Image {
    string url = 1;
    string title = 2;
    Link link = 3;
    int32 width = 4;
    int32 height = 5;
    string description = 6;
}

message Entry {
    string title = 1;
    string guid = 2;
    string summary = 3;
    Content content = 4;
    repeated Link links = 5;
    repeated MediaObject media = 6;
    google.protobuf.Timestamp published = 7;
    // Last recorded playback position (zero when never listened to).
    int64 elapsedSeconds = 8;
    int32 elapsedNanos = 9;
    // The feed this entry belongs to. Required to act on an entry returned
    // by a ListEntries that spans feeds -- RecordPlayback needs both ids.
    string feedId = 10;
}

message MediaObject {
    string title = 1;
    repeated MediaContent content = 2;
    int32 duration_secs = 3;
    int32 duration_nsecs = 4;
    string description = 5;
}

message MediaContent {
    string url = 1;
    string contentType = 2;
    int32 height = 3;
    int32 width = 4;
    int32 size = 5;
}

message Content {
    string body = 1;
    string contentType = 2;
    int32 length = 3;
    Link src = 4;
}

message Link {
    string href = 1;
    string rel = 2;
    string mediaType = 3;
    string hrefLang = 4;
    string title = 5;
    int32 length = 6;
}

message Feeds {
    repeated Feed feeds = 1;
}

message Entries {
    repeated Entry entries = 1;
    // Empty exactly when this is the last page. A full page does not by
    // itself mean more remain.
    string nextPageToken = 2;
}
