[package]
name = "casts"
version = "0.1.0"
edition = "2021"

[features]
server = [
    "postgres",
    "tokio-postgres",
    "deadpool-postgres",
    "postgres-native-tls",
]
# client = ["rusqlite"]
default = ["server"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]


postgres = { version = "~0.19.5", optional = true, features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
postgres-native-tls = { version = "*", optional = true }
tokio-postgres = { version = "~0.7.8", optional = true }
deadpool-postgres = { version = "*", optional = true }

anyhow = "*"
bytes = "*"
async-trait = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "*"
serde_derive = "*"
pretty_env_logger = "*"
log = "*"
bson = "~2.9.0"
uuid = { version = "~1.7.0", features = ["serde", "v4"] }
commit-store = { path = "../commit-store" }
juniper = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161" }
juniper_hyper = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161" }
juniper_subscriptions = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161" }
lazy_static = "*"
juniper-swift = { path = "../juniper-swift" }
chrono = "*"
url = { version = "*", features = ["serde"] }
immutable-feed = { path = "../immutable-feed" }
hyper = "*"
tokio = { version = "~1.36.0", features = ["full"] }
futures = { version = "0.3.17", features = [
    "std",
    "async-await",
    "executor",
    "thread-pool",
] }
reqwest = "*"
futures-core = "*"

tonic = "*"
prost = "*"
prost-types = "*"

[build-dependencies]
tonic-build = "~0.11.0"
