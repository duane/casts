[package]
name = "casts"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# Every binary is declared explicitly below; auto-discovery would also build
# the parked casts-server, which still uses pre-1.x hyper APIs and does not
# compile.
autobins = false

[features]
graphql = ["juniper", "juniper_hyper", "juniper_subscriptions", "hyper-014"]
grpc = ["tonic", "tonic-health", "prost", "prost-types"]

default = ["grpc"]

[[bin]]
name = "casts-health-probe"
path = "src/bin/casts-health-probe.rs"
required-features = ["grpc"]

[[bin]]
name = "casts-grpc-client"
path = "src/bin/casts-grpc-client.rs"
required-features = ["grpc"]

[[bin]]
name = "dump-config"
path = "src/bin/dump-config.rs"

[[bin]]
name = "casts-grpc-server"
path = "src/bin/casts-grpc-server.rs"
required-features = ["grpc"]

[[bin]]
name = "casts-read"
path = "src/bin/casts-read.rs"
required-features = ["grpc"]

[[bin]]
name = "casts"
path = "src/bin/casts.rs"
required-features = ["grpc"]

[[bin]]
name = "introspect"
path = "src/bin/introspect.rs"
required-features = ["graphql"]

[[bin]]
name = "casts-server"
path = "src/bin/casts-server.rs"
required-features = ["graphql"]

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["grpc"]

[dependencies]
# internal
immutable-feed = { path = "../immutable-feed" }

# basic util
async-trait = "~0.1.79"
bytes = "~1.6.0"
chrono = "~0.4.37"
lazy_static = "~1.4.0"
url = { version = "~2.5.0", features = ["serde"] }
uuid = { version = "~1.8.0", features = ["v4", "serde"] }
toml = { version = "~0.8.12" }
byte-unit = { version = "~5.1.4" }

# logging
log = "~0.4.21"
pretty_env_logger = "~0.5.0"

# serde
bson = "~2.10.0"
serde = { version = "~1.0.197", features = ["derive"] }
serde_json = "~1.0.115"
serde_derive = "~1.0.197"

# errors
anyhow = "~1.0.81"

# commit-store
commit-store = { path = "../../commit-store" }

# http server and client libs
hyper = "~1.11"
# The pinned juniper rev's juniper_hyper is written against hyper 0.14, so
# casts-server speaks 0.14 under this renamed dep; both hyper major versions
# coexist in the graph. Retire this when the juniper pin moves to a rev that
# supports hyper 1.x.
hyper-014 = { package = "hyper", version = "~0.14.7", optional = true, features = [
    "server",
    "runtime",
    "http1",
    "tcp",
] }

# futures stuff
tokio = { version = "~1.37.0", features = ["full"] }
futures = { version = "0.3.17", features = [
    "std",
    "async-await",
    "executor",
    "thread-pool",
] }
futures-core = "~0.3.30"

# reqwest http client
reqwest = "~0.12.3"

# grpc
# Serves grpc.health.v1.Health so a load balancer can tell "the port is
# open" from "this task can actually reach the commit store".
tonic-health = { version = "~0.11.0", optional = true }
tonic = { version = "~0.11.0", optional = true }
prost = { version = "~0.12.4", optional = true }
prost-types = { version = "~0.12.4", optional = true }


# Juniper
juniper = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161", optional = true }
juniper_hyper = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161", optional = true }
juniper_subscriptions = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161", optional = true }


[dev-dependencies]
# `tower::service_fn` hands tonic an in-process `tokio::io::duplex` transport
# instead of a real socket, so the gRPC tests need no port and no startup
# sleep. Same harness shape as commit-store's `tests/grpc_e2e.rs`.
tower = "~0.4"
# Generates a throwaway CA and leaf certs at test time, so the mutual-TLS
# tests need no committed private key. Same approach as commit-store.
rcgen = "~0.13"
tokio-stream = "~0.1.15"

[build-dependencies]
tonic-build = "~0.11.0"
