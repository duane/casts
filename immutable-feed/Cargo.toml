[package]
name = "immutable-feed"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://git.sr.ht/~duane/immutable-feed"
readme = "README.md"

[dependencies]
## Time
chrono = { version = "~0.4.37", features = ["serde"] }

## error handling
anyhow = "~1.0.81"

## net
url = { version = "~2.5.0", features = ["serde"] }
reqwest = "~0.12.3"

## rss

feed-rs = "~1.4.0"
quick-xml = "~0.31.0"

## content handling
htmlescape = "~0.3.1"

## serialization
serde = "~1.0.197"

mime = "~0.3.17"
