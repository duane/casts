[package]
name = "juniper-swift"
version = "0.1.0"
authors = ["Duane Bailey <bailey.d.r@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
juniper = { git = "https://github.com/graphql-rust/juniper.git", rev = "984973658217f73d63608283d18723e11ce65161" }
serde_json = "*"
lazy_static = "*"
libc = "*"
futures = { version = "*", features = ["thread-pool"] }

[build-dependencies]
cbindgen = "*"
