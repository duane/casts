services:
  # Built from the external commit-store repository (a sibling checkout of
  # https://git.sr.ht/~duane/commit-store). Schema provisioning is a one-shot
  # run of its `provision` binary, not an init script, so a container restart
  # never becomes an implicit migration:
  #   docker compose run --rm commit-store provision
  commit-store:
    environment:
      - POSTGRES_ENDPOINT=postgresql://committer:committer@db:5432/committer
      - RUST_LOG=info
    build:
      context: ../commit-store
    ports:
      - "7392:7392"
    depends_on:
      - db
  casts:
    environment:
      - COMMIT_STORE_ADDR=http://commit-store:7392
    build:
      # Parent of both sibling checkouts, so the casts build can see its
      # `../../commit-store` path dependency.
      context: ..
      dockerfile: ./casts/deploy/casts/Dockerfile
    ports:
      - "8243:8243"
    depends_on:
      - commit-store
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: committer
      POSTGRES_USER: committer
      POSTGRES_PASSWORD: committer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
